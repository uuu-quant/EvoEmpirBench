[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoempirbench-game"
version = "0.1.0"
description = "Game environments and LLM-agent evaluation loops for EvoEmpirBench."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.20.0",
  "pygame>=2.1.0",
  "gymnasium>=0.28.1",
  "requests>=2.28.0",
  "python-dotenv>=0.20.0",
  "openai>=1.0.0",
  "pandas>=1.5.0",
  "matplotlib>=3.6.0",
  "tqdm>=4.64.0",
  "tabulate>=0.9.0",
  "seaborn>=0.12.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
